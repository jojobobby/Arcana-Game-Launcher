name: build-launcher

on:
  workflow_dispatch:
    inputs:
      mark_latest:
        description: 'Make this the release players get (Latest), and update the old "latest" tag'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - 'main'
    paths:
      - 'GameLauncher/**'
      - 'GameLauncher.Tests/**'
      - 'GameLauncher.sln'
      - 'installer/**'
      - '.github/workflows/build-launcher.yml'

permissions:
  contents: write

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # File versions need MAJOR.MINOR.BUILD.REV; the run number makes every build distinct. Each release gets its own
      # tag (v1.0.N.0), whose files never change: a launcher downloads the exe from the tag its metadata names.
      - name: Set version info
        id: version
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}.0"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore GameLauncher.sln

      # Downloads (resume, retries, stalls), install, repair, uninstall, self-update and the platform pieces they rest
      # on (renaming a running exe, the single-instance mutex) against a fake server. A red test never ships.
      - name: Test
        run: dotnet test GameLauncher.Tests/GameLauncher.Tests.csproj --no-restore -c Release --verbosity normal

      # Single-file, self-contained: no .NET install needed on the player's PC. ArcanaReleaseBuild makes this the build
      # that updates itself from GitHub and offers the installer (GameLauncher/LauncherInfo.cs).
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish GameLauncher/GameLauncher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:ArcanaReleaseBuild=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.version }} `
            -o publish
          if (-not (Test-Path publish\ArcanaLauncher.exe)) { throw 'Build output not found' }
          $info = (Get-Item publish\ArcanaLauncher.exe).VersionInfo
          if ($info.ProductName -ne 'Arcana Launcher' -or $info.CompanyName -ne 'Tidan Games LLC' -or $info.FileVersion -ne '${{ steps.version.outputs.version }}') {
            throw "Unexpected file info: '$($info.ProductName)' '$($info.CompanyName)' $($info.FileVersion)"
          }
          Write-Host "Built Arcana Launcher $($info.FileVersion) ($([math]::Round((Get-Item publish\ArcanaLauncher.exe).Length / 1MB, 2)) MB)"

      # Skipped while no certificate is set up (the user chose to ship unsigned for now). Note: a public code signing
      # certificate issued after 2023-06-01 keeps its key on hardware and cannot be exported as a .pfx, so signing will
      # move to a cloud signer (docs/superpowers/specs/2026-11-07-arcana-launcher-design.md in the Arcana repo, step 8).
      - name: Sign launcher
        id: sign
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.CODE_SIGN_CERT_BASE64 != '' }}
          CODE_SIGN_CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CODE_SIGN_CERT_BASE64))
          try {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue)?.Source
            if (-not $signtool) {
              $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $signtool) { throw 'signtool.exe not found' }
            & $signtool sign /f $certPath /p $env:CODE_SIGN_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "Arcana Launcher" publish\ArcanaLauncher.exe
            if ($LASTEXITCODE -ne 0) { throw 'signtool sign failed' }
            & $signtool verify /pa /v publish\ArcanaLauncher.exe
            if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed' }
          }
          finally { Remove-Item $certPath -Force }
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Note unsigned build
        if: ${{ steps.sign.outputs.signed != 'true' }}
        shell: pwsh
        run: Write-Host "::warning::Arcana Launcher is not code-signed; players see a SmartScreen warning on first run."

      # installer/ArcanaLauncher.iss: per-user install to %LocalAppData%\Programs\Arcana Launcher. The script itself
      # refuses an Inno Setup older than 6.3.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup (ISCC.exe) not found' }
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceExe=$PWD\publish\ArcanaLauncher.exe" "/O$PWD\publish" installer\ArcanaLauncher.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          $info = (Get-Item publish\ArcanaLauncherSetup.exe).VersionInfo
          Write-Host "Built $($info.FileDescription.Trim()) $($info.FileVersion.Trim()) ($([math]::Round((Get-Item publish\ArcanaLauncherSetup.exe).Length / 1MB, 2)) MB)"

      # Hashes AFTER any signing: a signature changes the bytes. Launchers read this file to update themselves
      # (GameLauncher/LauncherSelfUpdate.cs, LauncherRelease): release_tag names where the files live.
      - name: Build launcher metadata
        shell: pwsh
        run: |
          $exe = Get-Item publish\ArcanaLauncher.exe
          $setup = Get-Item publish\ArcanaLauncherSetup.exe
          [ordered]@{
            version         = '${{ steps.version.outputs.version }}'
            release_tag     = '${{ steps.version.outputs.release_tag }}'
            commit          = '${{ github.sha }}'
            build_date      = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            file_name       = $exe.Name
            file_size       = $exe.Length
            sha256          = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            setup_file_name = $setup.Name
            setup_size      = $setup.Length
            setup_sha256    = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            signed          = '${{ steps.sign.outputs.signed }}' -eq 'true'
          } | ConvertTo-Json | Set-Content publish\launcher-metadata.json -Encoding utf8NoBOM
          Get-Content publish\launcher-metadata.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arcana-Launcher-${{ steps.version.outputs.version }}
          path: |
            publish/ArcanaLauncher.exe
            publish/ArcanaLauncherSetup.exe
            publish/launcher-metadata.json
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Arcana-Launcher-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Compose release notes
        run: |
          {
            echo "## Arcana Launcher ${{ needs.build.outputs.version }}"
            echo ""
            echo "Commit \`${{ github.sha }}\`, built $(date -u +%Y-%m-%d)."
            echo ""
            echo "### Download"
            echo ""
            echo "- **ArcanaLauncherSetup.exe**: the installer. It installs Arcana Launcher for your Windows account (no admin rights) with a Start menu shortcut, then Arcana Launcher installs the game and keeps it up to date."
            echo "- **ArcanaLauncher.exe**: the launcher on its own. Installed launchers update themselves from it."
            echo "- **launcher-metadata.json**: the version, sizes and SHA-256 of both files."
            echo ""
            if [ "${{ needs.build.outputs.signed }}" != "true" ]; then
              echo "### If Windows says it protected your PC"
              echo ""
              echo "The installer is not code-signed yet. Click **More info**, then **Run anyway**."
              echo ""
            fi
            echo "To check a download in PowerShell: \`Get-FileHash ArcanaLauncherSetup.exe\` and compare it with \`setup_sha256\` in launcher-metadata.json."
          } > release-notes.md
          cat release-notes.md

      # The version's own release, with its files. GitHub's "Latest" marker moves to it in one step, so
      # releases/latest/download/... (the website's Download button, launchers from 1.0.10 on) never points at a
      # release that is half uploaded.
      - name: Create the version's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ github.event_name == 'push' || inputs.mark_latest }}
        run: |
          gh release create "${{ needs.build.outputs.release_tag }}" \
            --title "Arcana Launcher ${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" \
            --latest="$LATEST" \
            release-assets/ArcanaLauncher.exe release-assets/ArcanaLauncherSetup.exe release-assets/launcher-metadata.json

      # Launchers up to 1.0.9 read releases/download/latest/... (the tag named "latest"), and the oldest ones
      # YamanoRealmsLauncher.exe. That release is updated in place, never deleted (deleting it 404'd every link
      # until it was made again): files first, the metadata last, so it never names bytes that aren't there yet.
      # Drop the YamanoRealmsLauncher.exe line once its download count stops rising.
      - name: Update the old "latest" tag for launchers up to 1.0.9
        if: ${{ github.event_name == 'push' || inputs.mark_latest }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp release-assets/ArcanaLauncher.exe release-assets/YamanoRealmsLauncher.exe
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest release-assets/ArcanaLauncher.exe release-assets/YamanoRealmsLauncher.exe release-assets/ArcanaLauncherSetup.exe --clobber
            gh release upload latest release-assets/launcher-metadata.json --clobber
          else
            gh release create latest --title "Arcana Launcher (for launchers up to 1.0.9)" --notes-file release-notes.md --latest=false \
              release-assets/ArcanaLauncher.exe release-assets/YamanoRealmsLauncher.exe release-assets/ArcanaLauncherSetup.exe release-assets/launcher-metadata.json
          fi
          gh release edit latest --title "Arcana Launcher (for launchers up to 1.0.9)" --latest=false
